name: innovatsiina-diia-uat
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ['mongod', '--wiredTigerCacheSizeGB', '0.5']
    volumes:
      - mongo-data:/data/db
    networks: [database]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1}).ok']
      interval: 10s
      timeout: 5s
      retries: 15
    logging: &logging
      driver: local
      options:
        max-size: 10m
        max-file: '3'
  api:
    image: innovatsiina-diia-api:${RELEASE:-local}
    build:
      context: ..
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: innovatsiina_diia
      ADMIN_ORIGINS: https://${SITE_HOST:?Set SITE_HOST}
      PROJECT_IMAGES_DIR: /uploads/projects
      SPECIALIST_PORTFOLIOS_DIR: /uploads/specialists
      REPORTS_DIR: /uploads/reports
    volumes:
      - /srv/innovatsiina-diia/uploads:/uploads
    networks: [database, app]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  web:
    image: innovatsiina-diia-web:${RELEASE:-local}
    build:
      context: ..
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
      API_ORIGIN: http://api:3000
      SITE_ORIGIN: https://${SITE_HOST:?Set SITE_HOST}
      NG_ALLOWED_HOSTS: ${SITE_HOST},localhost
    networks: [app]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?Set SITE_HOST}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [app]
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
networks:
  database:
    internal: true
  app:
volumes:
  mongo-data:
  caddy-data:
  caddy-config:
